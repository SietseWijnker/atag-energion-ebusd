# Bounded setting scripts for Home Assistant (add to scripts.yaml or create via the UI in YAML mode).
#
# ebusd cannot enforce a value range on write messages, and the HA number entities generated by
# mqtt-hassio.cfg get the raw data type range (e.g. -3276.7..3276.7 for heat_LWT_offset).
# These scripts are the only intended way to change the settings below:
#   - hard bounds checked in the script itself (not only in the UI selector),
#   - write via ebusd MQTT (<prefix>/<circuit>/<name>/set),
#   - fresh read-back via <prefix>/<circuit>/<name>/get, waiting for THAT mqtt message
#     (a repeated, unchanged value does not update the HA sensor, so waiting on the sensor is unreliable),
#   - a persistent notification with the requested and the read-back value.
# Disable the raw ebusd number entity for heat_LWT_offset in HA (Settings > Entities) so it cannot be used by accident.
# Adjust the topic prefix "ebusd/" if your ebusd uses another --mqtttopic.

wp_pomp_pwm_instellen:
  alias: Heat pump - set pump PWM
  description: >-
    Set min/max PWM of the heat pump circulation pump (Atag manual 17.3.6 / 17.3.5) via ebusd, with fixed bounds
    (min 20-80, max 40-100, min < max) and read-back check. Factory defaults: min 40, max 100.
  mode: single
  icon: mdi:pump
  fields:
    min_pwm:
      name: Minimum PWM (%)
      description: 17.3.6, factory default 40
      required: true
      default: 40
      selector:
        number: { min: 20, max: 80, step: 1, unit_of_measurement: "%" }
    max_pwm:
      name: Maximum PWM (%)
      description: 17.3.5, factory default 100
      required: true
      default: 100
      selector:
        number: { min: 40, max: 100, step: 1, unit_of_measurement: "%" }
  sequence:
    - variables:
        lo: "{{ min_pwm | int(-1) }}"
        hi: "{{ max_pwm | int(-1) }}"
    - if:
        - condition: template
          value_template: "{{ not (20 <= lo <= 80 and 40 <= hi <= 100 and lo < hi) }}"
      then:
        - action: persistent_notification.create
          data:
            title: Heat pump PWM NOT changed
            message: "Invalid values: min {{ lo }} %, max {{ hi }} % (min 20-80, max 40-100, min < max)."
        - stop: invalid values
    # write max first, then min, so min < max holds at every step when raising both
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/pump_max_pwm/set, payload: "{{ hi }}" }
    - delay: 5
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/pump_min_pwm/set, payload: "{{ lo }}" }
    - delay: 5
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/pump_max_pwm/get, payload: "" }
    - wait_for_trigger:
        - trigger: mqtt
          topic: ebusd/heatpump/pump_max_pwm
      timeout: 30
    - variables:
        rb_hi: "{{ wait.trigger.payload_json['0'].value if wait.trigger else 'no answer' }}"
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/pump_min_pwm/get, payload: "" }
    - wait_for_trigger:
        - trigger: mqtt
          topic: ebusd/heatpump/pump_min_pwm
      timeout: 30
    - variables:
        rb_lo: "{{ wait.trigger.payload_json['0'].value if wait.trigger else 'no answer' }}"
        ok: "{{ rb_lo | string == lo | string and rb_hi | string == hi | string }}"
    - action: persistent_notification.create
      data:
        title: "Heat pump PWM {{ 'set' if ok else 'NOT confirmed - check!' }}"
        message: "Requested min {{ lo }} % / max {{ hi }} %, read back min {{ rb_lo }} % / max {{ rb_hi }} %."

wp_correctie_temperatuur_instellen:
  alias: Heat pump - set flow temperature correction
  description: >-
    Set 'Correctie WP temperatuur' (Atag manual 17.2.3, 0-10 °C, factory default 0) via ebusd, with fixed bounds
    and read-back check.
  mode: single
  icon: mdi:thermometer-plus
  fields:
    correctie:
      name: Correction (°C)
      description: 17.2.3, 0-10 °C, factory default 0
      required: true
      default: 0
      selector:
        number: { min: 0, max: 10, step: 0.5, unit_of_measurement: "°C" }
  sequence:
    - variables:
        c: "{{ correctie | float(-1) }}"
    - if:
        - condition: template
          value_template: "{{ not (0 <= c <= 10 and (c * 2) | round(0) == c * 2) }}"
      then:
        - action: persistent_notification.create
          data:
            title: Heat pump correction NOT changed
            message: "Invalid value {{ c }} °C (0-10 in steps of 0.5)."
        - stop: invalid value
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/heat_LWT_offset/set, payload: "{{ c }}" }
    - delay: 5
    - action: mqtt.publish
      data: { topic: ebusd/heatpump/heat_LWT_offset/get, payload: "" }
    - wait_for_trigger:
        - trigger: mqtt
          topic: ebusd/heatpump/heat_LWT_offset
      timeout: 30
    - variables:
        rb: "{{ wait.trigger.payload_json['0'].value if wait.trigger else 'no answer' }}"
        ok: "{{ rb is number and (rb - c) | abs < 0.05 }}"
    - action: persistent_notification.create
      data:
        title: "Heat pump correction {{ 'set' if ok else 'NOT confirmed - check!' }}"
        message: "Requested {{ c }} °C, read back {{ rb }} °C."
